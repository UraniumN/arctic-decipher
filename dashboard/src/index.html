<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LeakTrace — Interactive data leak investigation dashboard with tamper-evident provenance analysis" />
  <title>LeakTrace — Leak Investigation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="12" stroke="url(#grad)" stroke-width="2.5" fill="none"/>
            <path d="M10 10 L14 18 L18 10" stroke="url(#grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="grad" x1="0" y1="0" x2="28" y2="28"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs>
          </svg>
        </div>
        <h1 class="header-title">LeakTrace</h1>
        <span class="header-badge">Investigation Dashboard</span>
      </div>
      <div class="header-status">
        <div id="status-indicator" class="status-dot offline"></div>
        <span id="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Configuration Panel -->
      <section class="panel config-panel" id="config-panel">
        <h2 class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m11-7h-6m-6 0H1m18.07-5.07l-4.24 4.24M9.17 14.83l-4.24 4.24m0-14.14l4.24 4.24m5.66 5.66l4.24 4.24"/></svg>
          Configuration
        </h2>
        <div class="config-grid">
          <div class="config-field">
            <label for="tracer-url">Tracer URL</label>
            <input type="text" id="tracer-url" placeholder="http://localhost:8000" value="http://localhost:8000" />
          </div>
          <div class="config-field">
            <label for="erp-url">ERP URL</label>
            <input type="text" id="erp-url" placeholder="http://localhost:3001" value="http://localhost:3001" />
          </div>
          <div class="config-field">
            <label for="read-key">Read Key</label>
            <input type="password" id="read-key" placeholder="x-read-key" />
          </div>
          <div class="config-field">
            <label for="admin-key">Admin Key</label>
            <input type="password" id="admin-key" placeholder="x-admin-key" />
          </div>
        </div>
        <div class="config-actions">
          <button id="btn-connect" class="btn btn-primary">Connect & Verify</button>
        </div>
      </section>

      <!-- Investigation Panel -->
      <section class="panel investigate-panel" id="investigate-panel">
        <h2 class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          Investigate Leak
        </h2>
        <div class="investigate-grid">
          <div class="config-field">
            <label for="data-id">Data ID</label>
            <input type="text" id="data-id" placeholder="S1001" value="S1001" />
          </div>
          <div class="config-field">
            <label for="exposure">Exposure Node</label>
            <input type="text" id="exposure" placeholder="public_bucket" value="public_bucket" />
          </div>
          <div class="config-field full-width">
            <label for="leaked-text">Leaked Text (paste JSON)</label>
            <textarea id="leaked-text" rows="4" placeholder='{"id":"S1001","note_ref":"tok_ab12cd@trap.test",...}'></textarea>
          </div>
        </div>
        <div class="config-actions">
          <button id="btn-investigate" class="btn btn-primary" disabled>Investigate</button>
          <button id="btn-verify" class="btn btn-secondary" disabled>Verify Chain</button>
        </div>
      </section>

      <!-- Results Area -->
      <div class="results-grid" id="results-area" style="display: none;">
        <!-- Chain Status -->
        <section class="panel result-panel chain-panel">
          <h2 class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Chain Integrity
          </h2>
          <div id="chain-status" class="chain-status">
            <div class="stat-row">
              <span class="stat-label">Events</span>
              <span class="stat-value" id="chain-events">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Gaps</span>
              <span class="stat-value" id="chain-gaps">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Edited</span>
              <span class="stat-value" id="chain-edited">—</span>
            </div>
          </div>
          <div id="chain-details"></div>
        </section>

        <!-- Canary Match -->
        <section class="panel result-panel canary-panel">
          <h2 class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            Canary Token
          </h2>
          <div id="canary-result" class="canary-result">
            <p class="muted">No investigation yet</p>
          </div>
        </section>

        <!-- Suspects -->
        <section class="panel result-panel suspects-panel full-width">
          <h2 class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Suspect Ranking
          </h2>
          <div id="suspects-list" class="suspects-list">
            <p class="muted">No investigation yet</p>
          </div>
        </section>

        <!-- Provenance Graph -->
        <section class="panel result-panel graph-panel full-width">
          <h2 class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
            Provenance Graph
          </h2>
          <div id="graph-container" class="graph-container">
            <canvas id="graph-canvas"></canvas>
          </div>
        </section>
      </div>

      <!-- Custodian Reveal -->
      <section class="panel reveal-panel" id="reveal-panel" style="display: none;">
        <h2 class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Custodian Reveal
          <button id="btn-reveal" class="btn btn-small btn-warning" disabled>Reveal Identities</button>
        </h2>
        <div id="reveal-result" class="reveal-result">
          <p class="muted">Click to reveal real identities (requires admin key)</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="api/client.js"></script>
  <script type="module" src="components/graph.js"></script>
  <script type="module" src="pages/app.js"></script>
</body>
</html>
